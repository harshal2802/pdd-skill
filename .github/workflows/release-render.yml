name: Release Render

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Render workflow tables
        run: |
          python3 scripts/render_workflow_tables.py --version "${{ github.event.release.tag_name }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Re-render generated sections for ${{ github.event.release.tag_name }}"
          branch: auto/re-render-generated-sections
          base: main
          title: "Re-render generated sections for ${{ github.event.release.tag_name }}"
          body: >
            Automated re-render of generated sections triggered by
            release ${{ github.event.release.tag_name }}.
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"