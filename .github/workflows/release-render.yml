name: Release Render

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Render workflow tables
        run: python3 scripts/render_workflow_tables.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Re-render generated sections"
          branch: auto/re-render-generated-sections
          title: "Re-render generated sections"
          body: "Automated re-render of generated sections triggered by a push to main."
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

