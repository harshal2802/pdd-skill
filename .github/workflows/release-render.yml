# Release Render Workflow

name: Release Render

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Commit changes
        run: |
          git add .
          git diff --cached --quiet || git commit -m 'Release changes'

      - name: Publish release
        run: npm publish

